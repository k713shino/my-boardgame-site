<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>カウントダウン</title>
  <style>
    :root{
      --kd-accent:#111;
      --kd-heading:clamp(28px,5.5vw,56px);
      --kd-sub:clamp(14px,3vw,20px);
      --kd-num:clamp(44px,12vw,92px);
      --kd-label:clamp(12px,2.5vw,18px);
      --kd-gap:clamp(8px,3vw,24px);
      --kd-bg:transparent;
    }
    html,body{height:100%}
    body{
      margin:0;
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic",sans-serif;
      color:var(--kd-accent);
      background:var(--kd-bg);
    }
    .kd-wrap{
      max-width:min(100%,980px);
      margin:0 auto;
      padding:clamp(8px,2vw,16px) 12px;
      text-align:center;
      line-height:1.2;
    }
    .kd-heading{
      margin:.1em 0 .2em;
      font-weight:800;
      letter-spacing:.02em;
      font-size:var(--kd-heading);
    }
    .kd-sub{
      margin:0 0 .6em;
      font-size:var(--kd-sub);
      opacity:.8;
    }
    .kd-row{
      display:inline-grid;
      grid-auto-flow:column;
      gap:var(--kd-gap);
      align-items:end;
      justify-items:center;
    }
    .kd-unit{
      display:inline-flex;
      flex-direction:column;
      align-items:center;
      min-width:clamp(64px,18vw,160px);
    }
    .kd-value{
      font-weight:900;
      font-variant-numeric:tabular-nums;
      font-size:var(--kd-num);
      line-height:1;
      text-shadow:0 1px 0 rgba(0,0,0,.04);
    }
    .kd-label{
      margin-top:.2em;
      font-size:var(--kd-label);
      font-weight:600;
      opacity:.9;
    }
    @media (max-width:360px){ .kd-unit{min-width:56px} }
    @media (prefers-reduced-motion: reduce){ .kd-value{transition:none} }
  </style>
</head>
<body>
  <div class="kd-wrap" aria-live="polite">
    <p class="kd-heading" id="kd-title">ぷよぷよ™テトリス®２ in キリハロまで</p>
    <p class="kd-sub" id="kd-sub">キリハロまで何日かなぁ〜♪</p>
    <div class="kd-row" role="group" aria-label="カウントダウン">
      <span class="kd-unit"><span class="kd-value" data-kd="days">0</span><span class="kd-label">日</span></span>
      <span class="kd-unit"><span class="kd-value" data-kd="hours">00</span><span class="kd-label">時間</span></span>
      <span class="kd-unit"><span class="kd-value" data-kd="minutes">00</span><span class="kd-label">分</span></span>
      <span class="kd-unit"><span class="kd-value" data-kd="seconds">00</span><span class="kd-label">秒</span></span>
    </div>
  </div>

  <script>
    (function(){
      "use strict";
      const params = new URLSearchParams(location.search);
      const title = params.get("title");
      const sub = params.get("sub");
      const deadline = params.get("deadline"); // ISO推奨: 2025-11-01T00:00:00+09:00
      const accent = params.get("accent");     // 例: %23111 または rgb(…) / black / #111
      const bg = params.get("bg");             // 例: transparent / #fff / linear-gradient(...)

      if(title) document.getElementById("kd-title").textContent = title;
      if(sub)   document.getElementById("kd-sub").textContent   = sub;
      if(accent) document.documentElement.style.setProperty("--kd-accent", accent);
      if(bg)     document.documentElement.style.setProperty("--kd-bg", bg);

      const target = new Date(deadline || "2025-11-01T00:00:00+09:00");
      const $d = document.querySelector('[data-kd="days"]');
      const $h = document.querySelector('[data-kd="hours"]');
      const $m = document.querySelector('[data-kd="minutes"]');
      const $s = document.querySelector('[data-kd="seconds"]');

      const z2 = (n)=>String(n).padStart(2,"0");
      const diff = (t)=>{
        const now = new Date();
        const ms = t - now;
        const clamp = Math.max(ms,0);
        return {
          days: Math.floor(clamp/86400000),
          hrs:  Math.floor(clamp/3600000)%24,
          min:  Math.floor(clamp/60000)%60,
          sec:  Math.floor(clamp/1000)%60,
          ended: ms<=0
        };
      };

      const render = ()=>{
        const p = diff(target);
        if($d) $d.textContent = p.days;
        if($h) $h.textContent = z2(p.hrs);
        if($m) $m.textContent = z2(p.min);
        if($s) $s.textContent = z2(p.sec);
        if(p.ended) document.querySelector(".kd-wrap").setAttribute("aria-label","イベントが開始または終了いたしました");
      };
      render();
      const t = setInterval(()=>{
        const p = diff(target);
        if(p.ended) clearInterval(t);
        if($d) $d.textContent = p.days;
        if($h) $h.textContent = z2(p.hrs);
        if($m) $m.textContent = z2(p.min);
        if($s) $s.textContent = z2(p.sec);
      },1000);
    })();
  </script>
</body>
</html>
